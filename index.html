<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>霓虹装甲 · 坦克大战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070f; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e6f1ff;
    -webkit-user-select: none; user-select: none;
  }
  #wrap { position: relative; }
  canvas#game {
    display: block; width: min(100vw, 100vh, 920px); height: min(100vw, 100vh, 920px);
    background: #0a0e1a; box-shadow: 0 0 60px rgba(0,240,255,.12);
  }

  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(ellipse at center, rgba(10,14,26,.88), rgba(5,7,15,.96));
    text-align: center; z-index: 10;
  }
  .hidden { display: none !important; }
  h1 { font-size: 44px; letter-spacing: 6px; font-weight: 800; }
  h1 .neon {
    color: #00f0ff; text-shadow: 0 0 12px #00f0ff, 0 0 34px rgba(0,240,255,.6);
  }
  .sub { color: #7ea4c8; letter-spacing: 3px; font-size: 13px; }
  .label { color: #7ea4c8; letter-spacing: 2px; font-size: 13px; margin-top: 6px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    background: rgba(0,240,255,.06); color: #e6f1ff; border: 1px solid rgba(0,240,255,.35);
    padding: 10px 18px; font-size: 15px; letter-spacing: 2px; cursor: pointer;
    border-radius: 4px; transition: all .15s ease; font-family: inherit;
  }
  button:hover { background: rgba(0,240,255,.18); box-shadow: 0 0 12px rgba(0,240,255,.4); }
  button.sel {
    background: rgba(0,240,255,.25); border-color: #00f0ff; color: #fff;
    box-shadow: 0 0 14px rgba(0,240,255,.6);
  }
  button.start {
    margin-top: 10px; padding: 13px 40px; font-size: 18px; color: #05131a;
    background: #00f0ff; border: none; font-weight: 800; letter-spacing: 4px;
  }
  button.start:hover { box-shadow: 0 0 22px #00f0ff; }
  .hint { color: #58718a; font-size: 12px; line-height: 1.8; letter-spacing: 1px; }
  #resultTitle { font-size: 40px; letter-spacing: 4px; font-weight: 800; }
  #resultTitle.win { color: #3dffa0; text-shadow: 0 0 14px rgba(61,255,160,.7); }
  #resultTitle.lose { color: #ff2d95; text-shadow: 0 0 14px rgba(255,45,149,.7); }
  #stats { color: #bcd2e6; font-size: 15px; line-height: 2.1; letter-spacing: 1px; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>

    <div id="menu" class="overlay">
      <h1>NEON <span class="neon">ARMOR</span></h1>
      <div class="sub">霓 虹 装 甲 · 坦 克 大 战</div>

      <div class="label">选择难度</div>
      <div class="row" id="diffRow">
        <button data-diff="easy">简单</button>
        <button data-diff="normal" class="sel">普通</button>
        <button data-diff="hard">困难</button>
      </div>

      <div class="label">选择战车</div>
      <div class="row" id="tankRow">
        <button data-tank="assault" class="sel">突击者</button>
        <button data-tank="titan">泰坦</button>
        <button data-tank="phantom">幽灵</button>
      </div>

      <button class="start" id="startBtn">开始游戏</button>
      <div class="hint">
        WASD / 方向键 移动 · 鼠标瞄准 · 左键/空格 射击<br>
        E / 右键 大招 · 1 2 3 道具 · P / Esc 暂停
      </div>
    </div>

    <div id="result" class="overlay hidden">
      <div id="resultTitle">胜利</div>
      <div id="stats"></div>
      <div class="row">
        <button id="nextBtn" class="start">下一关</button>
        <button id="retryBtn">重试本关</button>
        <button id="menuBtn">返回菜单</button>
      </div>
    </div>

    <div id="pause" class="overlay hidden">
      <h1>暂停中</h1>
      <div class="row">
        <button id="resumeBtn" class="start">继续</button>
        <button id="pauseMenuBtn">返回菜单</button>
      </div>
    </div>
  </div>

  <script src="src/util.js"></script>
  <script src="src/config.js"></script>
  <script src="src/input.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/map.js"></script>
  <script src="src/danmaku.js"></script>
  <script src="src/entities.js"></script>
  <script src="src/systems.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
